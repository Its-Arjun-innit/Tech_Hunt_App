<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Campus Hunt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a2119; --surface: #242e22; --surface-el: #2d3a2b;
    --primary: #80D917; --primary-fg: #1a2e0a;
    --success: #30B566; --success-strong: #1a8a46;
    --warning: #E5A820; --warning-fg: #3d2e05;
    --danger: #C44040; --info: #4D8FE5;
    --text: #F5F3F0; --text-muted: #9BA396; --text-faint: #7A8275;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);
    --radius: 14px; --radius-sm: 10px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow: hidden; position: relative;
  }
  .grain {
    position: fixed; inset: 0; opacity: 0.03; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px; z-index: 100;
  }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 8px; font-size: 14px; font-weight: 600; z-index: 10;
  }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 16px; fill: var(--text); }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; z-index: 10;
  }

  .screen { padding-top: 54px; padding-bottom: 80px; min-height: 100vh; }

  /* Header */
  .header {
    padding: 16px 20px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 1px solid var(--border);
  }
  .team-name { font-size: 15px; font-weight: 600; }
  .score-block { text-align: right; }
  .score-num {
    font-size: 32px; font-weight: 800; letter-spacing: -1px;
    color: var(--primary); line-height: 1;
  }
  .score-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .rank {
    font-size: 13px; color: var(--text-muted); margin-top: 4px;
  }

  .content { padding: 20px; }

  /* Objective Card */
  .obj-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    position: relative; overflow: hidden;
  }
  .obj-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--primary); display: flex;
    align-items: center; gap: 6px;
  }
  .obj-label svg { width: 14px; height: 14px; stroke: var(--primary); fill: none; stroke-width: 2; }
  .obj-clue {
    font-size: 20px; font-weight: 700; line-height: 1.35;
    margin-top: 14px; letter-spacing: -0.3px;
  }
  .obj-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 12px; font-size: 13px; color: var(--text-muted);
  }
  .obj-meta svg { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2; }

  /* Dotted arc decoration */
  .arc-deco {
    position: absolute; bottom: -20px; right: -20px;
    width: 80px; height: 80px; opacity: 0.1;
  }
  .arc-deco circle {
    fill: none; stroke: var(--primary); stroke-width: 1.5;
    stroke-dasharray: 4 4;
  }

  /* Stat strip */
  .stat-strip {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-top: 16px;
  }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
  }
  .stat-tile .label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 5px;
  }
  .stat-tile .label svg { width: 12px; height: 12px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
  .stat-tile .value {
    font-size: 22px; font-weight: 700; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* Announcements */
  .announcements {
    margin-top: 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .announcements .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .announcements .section-label svg { width: 12px; height: 12px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
  .ann-item { margin-top: 12px; }
  .ann-item p { font-size: 14px; line-height: 1.45; }
  .ann-item .time { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

  /* Bottom Nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding: 8px 0 20px; z-index: 10;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; font-size: 10px; color: var(--text-faint);
    min-width: 50px;
  }
  .nav-item.active { color: var(--primary); }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .nav-item.active svg { stroke-width: 2.2; }

  .scan-btn {
    width: 56px; height: 56px; background: var(--primary);
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; margin-top: -28px;
    box-shadow: 0 4px 20px rgba(128,217,23,0.35);
  }
  .scan-btn svg { width: 26px; height: 26px; stroke: var(--primary-fg); fill: none; stroke-width: 2; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="icons">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="header">
      <div>
        <div class="team-name">Alpha Squad</div>
        <div class="rank">#3 of 24 teams</div>
      </div>
      <div class="score-block">
        <div class="score-num">2,450</div>
        <div class="score-label">points</div>
      </div>
    </div>

    <div class="content">
      <div class="obj-card">
        <div class="obj-label">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          Next Destination
        </div>
        <div class="obj-clue">Where knowledge sleeps beneath open sky</div>
        <div class="obj-meta">
          <svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4S4 2.5 4 6v10z"/></svg>
          About 4 min walk
        </div>
        <svg class="arc-deco" viewBox="0 0 80 80"><circle cx="40" cy="40" r="35"/></svg>
      </div>

      <div class="stat-strip">
        <div class="stat-tile">
          <div class="label">
            <svg viewBox="0 0 24 24"><path d="M14 4l2.29 2.29-2.88 2.88 1.42 1.42 2.88-2.88L20 10V4zm-4 0H4v6l2.29-2.29 4.71 4.7V20h2v-8.41l-5.29-5.3z"/></svg>
            Checkpoints
          </div>
          <div class="value">7/12</div>
        </div>
        <div class="stat-tile">
          <div class="label">
            <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.38 0 2.5 1.12 2.5 2.5S4.88 15.8 3.5 15.8H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg>
            Challenges
          </div>
          <div class="value">3</div>
        </div>
      </div>

      <div class="announcements">
        <div class="section-label">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          Announcements
        </div>
        <div class="ann-item">
          <p>Checkpoint at the Library Annex has been relocated to the north entrance.</p>
          <div class="time">2:15 PM</div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      Clue
    </div>
    <div class="nav-item">
      <div class="scan-btn">
        <svg viewBox="0 0 24 24"><path d="M3 7V5c0-1.1.9-2 2-2h2M17 3h2c1.1 0 2 .9 2 2v2M21 17v2c0 1.1-.9 2-2 2h-2M7 21H5c-1.1 0-2-.9-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
      </div>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Team
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Activity
    </div>
  </nav>

  <div class="home-indicator"></div>
</body>
</html>
