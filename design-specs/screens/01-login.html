<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Campus Hunt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a2119;
    --surface: #242e22;
    --surface-elevated: #2d3a2b;
    --primary: #80D917;
    --primary-strong: #5CB80A;
    --primary-fg: #1a2e0a;
    --success: #30B566;
    --warning: #E5A820;
    --danger: #C44040;
    --info: #4D8FE5;
    --text: #F5F3F0;
    --text-muted: #9BA396;
    --text-faint: #7A8275;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --radius: 14px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Ambient glows */
  .glow-1 {
    position: absolute;
    top: -80px;
    left: -60px;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(128,217,23,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .glow-2 {
    position: absolute;
    bottom: -100px;
    right: -60px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(128,217,23,0.08) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Grain overlay */
  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.03;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    z-index: 100;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .icon-badge {
    width: 64px;
    height: 64px;
    background: var(--primary);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(128,217,23,0.25);
  }

  .icon-badge svg {
    width: 32px;
    height: 32px;
    stroke: var(--primary-fg);
    stroke-width: 2;
    fill: none;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-top: 20px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-top: 32px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field:last-of-type {
    margin-bottom: 24px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    height: 48px;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 0 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .field input::placeholder {
    color: var(--text-faint);
  }

  .field input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(128,217,23,0.15);
  }

  .btn-primary {
    width: 100%;
    height: 52px;
    background: var(--primary);
    color: var(--primary-fg);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .help-text {
    text-align: center;
    font-size: 13px;
    color: var(--text-faint);
    margin-top: 20px;
  }

  .organizer-link {
    text-align: center;
    margin-top: 10px;
  }

  .organizer-link a {
    font-size: 13px;
    color: var(--text-faint);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 8px;
    font-size: 14px;
    font-weight: 600;
    z-index: 10;
  }

  .status-bar .time { font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 16px; fill: var(--text); }

  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </span>
  </div>

  <div class="container">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    </div>
    <h1>Campus Hunt</h1>
    <p class="subtitle">Enter your team credentials to continue.</p>

    <div class="card">
      <div class="field">
        <label>Team name</label>
        <input type="text" placeholder="e.g. Alpha Squad">
      </div>
      <div class="field">
        <label>Member code</label>
        <input type="text" placeholder="e.g. ASM-042">
      </div>
      <div class="field">
        <label>6-digit PIN</label>
        <input type="password" placeholder="••••••">
      </div>
      <button class="btn-primary">Sign in</button>
    </div>

    <p class="help-text">Need help? Find an organizer.</p>
    <div class="organizer-link">
      <a href="#">Organizer sign in</a>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
